<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrator Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #064e3b;
            --primary-hover: #043d2e;
            --background: #f3f7f4;
            --text: #202b25;
            --muted: #6b776f;
            --border: #e1e8e3;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        .topbar {
            background: var(--primary);
            color: white;
            padding: 18px 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .topbar-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand-title {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .logout {
            padding: 11px 18px;
            background: white;
            color: var(--primary);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .logout:hover {
            background: #e6f1e9;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            color: var(--primary);
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .menu button {
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .menu button:hover {
            background: var(--primary-hover);
        }

        h2 {
            margin-top: 10px;
            color: var(--primary);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: var(--primary);
            color: white;
        }

        tr:nth-child(even) {
            background: #f3f7f4;
        }

        .message {
            text-align: center;
            padding: 20px;
            color: var(--muted);
        }

        .staff-btn {
            display: inline-block;
            padding: 12px 18px;
            margin: 10px 0 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .staff-btn:hover {
            background: var(--primary-hover);
        }

        @media (max-width: 700px) {
            .topbar {
                padding: 16px;
            }

            .brand-title {
                font-size: 18px;
            }

            .logout {
                padding: 10px 13px;
                font-size: 13px;
            }

            .container {
                margin: 20px auto;
                padding: 12px;
            }

            .card {
                padding: 22px 16px;
            }

            .menu {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 23px;
            }
        }

        @media (max-width: 380px) {
            .brand-title {
                font-size: 16px;
            }

            .topbar-inner {
                gap: 8px;
            }

            .logout {
                padding: 9px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">

            <p class="brand-title">Administrator Dashboard</p>

            <button
                class="logout"
                onclick="location.href='login.html'">
                Logout
            </button>

        </div>
    </header>

    <main class="container">

        <section class="card">

            <h1>Administrator Dashboard</h1>

            <p class="subtitle">
                Manage the Barangay Documents Request System
            </p>

            <div class="menu">

                <button onclick="showUsers()">
                    Manage Users
                </button>

                <button onclick="showRequests()">
                    Manage Requests
                </button>

                <button onclick="showRecords()">
                    View Records
                </button>

                <button onclick="showReports()">
                    View Reports
                </button>

            </div>

            <div id="content"></div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const content = document.getElementById("content");

        async function showUsers() {
            content.innerHTML = `
                <h2>Manage Users</h2>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Contact Number</th>
                                <th>Role</th>
                            </tr>
                        </thead>

                        <tbody id="userTable">
                            <tr>
                                <td colspan="5" class="message">
                                    Loading users...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;

            const {
                data: users,
                error
            } = await supabaseClient
                .from("users")
                .select("*")
                .order("created_at", {
                    ascending: false
                });

            if (error) {
                document.getElementById("userTable").innerHTML = `
                    <tr>
                        <td colspan="5" class="message">
                            Failed to load users.
                        </td>
                    </tr>
                `;

                alert("Error: " + error.message);
                return;
            }

            if (!users || users.length === 0) {
                document.getElementById("userTable").innerHTML = `
                    <tr>
                        <td colspan="5" class="message">
                            No users found.
                        </td>
                    </tr>
                `;
                return;
            }

            const table = document.getElementById("userTable");
            table.innerHTML = "";

            users.forEach(function(user) {
                const row = document.createElement("tr");

                const values = [
                    user.id,
                    user.full_name || "-",
                    user.email || "-",
                    user.contact_number || "-",
                    user.role || "Resident"
                ];

                values.forEach(function(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                table.appendChild(row);
            });
        }

        function showRequests() {
            content.innerHTML = `
                <h2>Manage Requests</h2>

                <p>
                    Open the Staff Dashboard to review and manage
                    resident document requests.
                </p>

                <button
                    class="staff-btn"
                    onclick="location.href='staff-dashboard.html'">
                    Open Staff Dashboard &#8594;
                </button>
            `;
        }

        async function showRecords() {
            content.innerHTML = `
                <h2>View Records</h2>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Resident</th>
                                <th>Document</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>

                        <tbody id="recordTable">
                            <tr>
                                <td colspan="5" class="message">
                                    Loading records...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;

            const {
                data: records,
                error
            } = await supabaseClient
                .from("document_requests")
                .select("*")
                .order("created_at", {
                    ascending: false
                });

            if (error) {
                alert("Error: " + error.message);
                return;
            }

            const table = document.getElementById("recordTable");
            table.innerHTML = "";

            if (!records || records.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="5" class="message">
                            No records found.
                        </td>
                    </tr>
                `;
                return;
            }

            records.forEach(function(record) {
                const row = document.createElement("tr");

                const values = [
                    record.id,
                    record.resident_name || "-",
                    record.document_type || "-",
                    record.status || "Pending",
                    record.request_date || "-"
                ];

                values.forEach(function(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                table.appendChild(row);
            });
        }

        async function showReports() {
            content.innerHTML = `
                <h2>View Reports</h2>

                <p>Loading request summary...</p>

                <div id="reportData">
                    Please wait...
                </div>
            `;

            const {
                data: requests,
                error
            } = await supabaseClient
                .from("document_requests")
                .select("status");

            if (error) {
                alert("Error: " + error.message);
                return;
            }

            let pending = 0;
            let approved = 0;
            let rejected = 0;

            requests.forEach(function(request) {
                if (request.status === "Pending") {
                    pending++;
                } else if (request.status === "Approved") {
                    approved++;
                } else if (request.status === "Rejected") {
                    rejected++;
                }
            });

            document.getElementById("reportData").innerHTML = `
                <div class="table-container">
                    <table>
                        <tr>
                            <th>Status</th>
                            <th>Total</th>
                        </tr>

                        <tr>
                            <td>Pending</td>
                            <td>${pending}</td>
                        </tr>

                        <tr>
                            <td>Approved</td>
                            <td>${approved}</td>
                        </tr>

                        <tr>
                            <td>Rejected</td>
                            <td>${rejected}</td>
                        </tr>

                        <tr>
                            <th>Total Requests</th>
                            <th>${requests.length}</th>
                        </tr>
                    </table>
                </div>
            `;
        }
    </script>

</body>
</html>
