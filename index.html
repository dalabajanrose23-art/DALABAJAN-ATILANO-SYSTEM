<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barangay Documents Request System</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #111;
        }

        .navbar {
            background: #064e3b;
            color: white;
            padding: 18px 30px;

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .nav-content {
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .nav-links button {
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .login-btn {
            background: transparent;
            color: white;
            border: 1px solid white;
        }

        .login-btn:hover {
            background: white;
            color: #064e3b;
        }

        .register-btn {
            background: white;
            color: #064e3b;
            border: 1px solid white;
        }

        .register-btn:hover {
            background: #dcfce7;
        }

        .hero {
            max-width: 1000px;
            margin: 70px auto;
            padding: 0 25px;
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: #064e3b;
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin: 0 0 15px;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto;
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }

        .choices {
            max-width: 800px;
            margin: 45px auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 0 25px;
        }

        .choice {
            background: white;
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: 0.3s;
        }

        .choice:hover {
            border-color: #064e3b;
            box-shadow: 0 5px 15px rgba(6, 78, 59, 0.08);
        }

        .choice h2 {
            margin: 10px 0;
            font-size: 22px;
        }

        .choice p {
            color: #666;
            line-height: 1.5;
        }

        .choice button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            background: #064e3b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .choice button:hover {
            background: #047857;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            .navbar {
                padding: 15px 18px;
            }

            .nav-content {
                flex-direction: column;
                gap: 12px;
            }

            .logo {
                text-align: center;
                font-size: 16px;
            }

            .nav-links {
                justify-content: center;
            }

            .hero {
                margin: 45px auto;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 16px;
            }

            .choices {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-content">

            <div class="logo">
                Barangay Documents Request System
            </div>

            <div class="nav-links">
                <button
                    class="login-btn"
                    onclick="location.href='login.html'">
                    Login
                </button>

                <button
                    class="register-btn"
                    onclick="location.href='register.html'">
                    Register
                </button>
            </div>

        </div>
    </nav>

    <section class="hero">

        <div class="icon">
            <i class="fa-solid fa-file"></i>
        </div>

        <h1>Barangay Documents Request System</h1>


    </section>

    <section class="choices">

        <div class="choice">

            <div style="font-size: 35px;">
                <i class="fa-solid fa-key"></i>
            </div>

            <h2>Login</h2>

            <p>
                Access your account and manage your
                barangay document requests.
            </p>

            <button onclick="location.href='login.html'">
                Log in
            </button>

        </div>

        <div class="choice">

            <div style="font-size: 35px;">
                <i class="fa-solid fa-file-pen"></i>
            </div>

            <h2>Create an Account</h2>

            <p>
                Register as a resident to start
                requesting barangay documents.
            </p>

            <button onclick="location.href='register.html'">
                Create Account
            </button>

        </div>

    </section>

    <div class="footer">
    </div>

</body>
</html>
