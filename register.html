<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resident Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 10px;
        }

        .card {
            background: white;
            padding: 35px;
            border: 1px solid #e1e7e4;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            color: #064e3b;
            font-size: 32px;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 0 0 30px;
            font-size: 16px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #183d31;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5ddd8;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 20px;
            background: #fff;
            color: #111;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #064e3b;
            box-shadow: 0 0 0 3px rgba(6, 78, 59, 0.10);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: #064e3b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .register-btn:hover {
            background: #047857;
        }

        .register-btn:active {
            transform: scale(0.99);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: white;
            color: #064e3b;
            border: 1px solid #064e3b;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        .back-btn:hover {
            background: #ecfdf5;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 5px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 16px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 25px;
            }

            input {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Resident Registration</h1>

        <p class="subtitle">
            Create your resident account
        </p>

        <form id="registerForm">

            <label for="fullName">Full Name</label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >

            <label for="contactNumber">Contact Number</label>

            <input
                type="text"
                id="contactNumber"
                placeholder="Enter your 11-digit contact number"
                required
                maxlength="11"
                minlength="11"
                pattern="[0-9]{11}"
                inputmode="numeric"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
                minlength="6"
            >

            <button
                type="submit"
                id="registerBtn"
                class="register-btn"
            >
                Register
            </button>

        </form>

        <button
            type="button"
            class="back-btn"
            onclick="location.href='login.html'"
        >
            Back to Login
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
document.getElementById("registerForm")
.addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("registerBtn");

    if (button.disabled) return;

    button.disabled = true;
    button.textContent = "Registering...";

    try {
        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const contactNumber =
            document.getElementById("contactNumber").value.trim();

        const password =
            document.getElementById("password").value;

        if (!/^[0-9]{11}$/.test(contactNumber)) {
            throw new Error(
                "Please enter a valid 11-digit contact number."
            );
        }

        const { data, error } =
            await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: fullName,
                        contact_number: contactNumber
                    }
                }
            });

        if (error) throw error;

        if (!data.user) {
            throw new Error(
                "The account could not be created. Please try again."
            );
        }

        if (data.session) {
            alert(
                "Registration successful! You can now log in."
            );
        } else {
            alert(
                "Registration successful! Please check your email " +
                "to confirm your account before logging in."
            );
        }

        window.location.href = "login.html";

    } catch (error) {
        console.error("Registration error:", error);
        alert(error.message || "Registration failed.");
    } finally {
        button.disabled = false;
        button.textContent = "Register";
    }
});
</script>

</body>
</html>
